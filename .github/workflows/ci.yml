name: CI

on:
  push:
    branches: [solution]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install and test
        run: |
          pip install -r requirements.txt pytest-cov
          pytest --cov=app --cov=github_client --cov-report=term --cov-report=xml --cov-report=html

      - name: Build image
        run: docker build -t gists-api:${{ github.sha }} .

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: gists-api:${{ github.sha }}
          format: table
          output: trivy.txt
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image
        run: |
          docker tag gists-api:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/gists-api:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/gists-api:latest

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.xml
            htmlcov/

      - name: Upload trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy.txt
